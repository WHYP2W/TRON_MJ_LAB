[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tron2-mjlab"
version = "0.1.0"
description = "TRON2A SFYG locomotion and arm control with mjlab on native Windows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mjlab==1.6.0",
    "torch==2.10.0",
]

[project.entry-points."mjlab.tasks"]
tron2_yg = "tron2_mjlab"

[project.scripts]
tron2-check = "tron2_mjlab.check:main"

[dependency-groups]
dev = ["pyright>=1.1.408,<2", "pytest>=8,<10", "ruff>=0.9"]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: native CUDA integration tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I"]