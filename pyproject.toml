[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tron2-mjlab"
version = "0.1.0"
description = "TRON2A SFYG locomotion and arm control with mjlab on native Windows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mjlab==1.6.0",
    "torch==2.10.0",
]

[project.entry-points."mjlab.tasks"]
tron2_yg = "tron2_mjlab"

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
