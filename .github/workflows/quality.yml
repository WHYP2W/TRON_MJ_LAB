name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.3"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Check formatting
        run: uv run --locked ruff format --check src tests
      - name: Lint
        run: uv run --locked ruff check src tests
      - name: Check types
        run: uv run --locked pyright
      - name: Download pinned SFYG model
        shell: powershell
        run: .\scripts\setup_assets.ps1
      - name: Run non-GPU tests
        run: uv run --locked pytest -q -m "not gpu"
      - name: Build distribution
        run: uv build --no-sources
